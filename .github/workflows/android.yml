name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Minimal Android Project Structure
        run: |
          mkdir -p app/src/main
          echo 'android { compileSdk 34; defaultConfig { minSdk 21; targetSdk 34; } }' > app/build.gradle
          echo 'package com.example.myapp;' > app/src/main/MainActivity.java
          echo '<manifest package="com.example.myapp"><application android:label="H.M App"><activity android:name=".MainActivity"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          echo 'include(":app")' > settings.gradle
          echo 'distributionBase=GRADLE_USER_HOME' > gradle.properties
          gradle wrapper

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-first-apk
          path: app/build/outputs/apk/debug/app-debug.apk
